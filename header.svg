<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12052b"/>
      <stop offset="100%" stop-color="#1e0b45"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="22"/>
    </clipPath>
    <style>
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .sub   { font: 600 22px 'SF Mono', Menlo, Consolas, 'Courier New', monospace; letter-spacing: 4px; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .drift1 { animation: drift1 9s ease-in-out infinite; }
      .drift2 { animation: drift2 11s ease-in-out infinite; }
      .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,20px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-15px); } }
      @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <ellipse class="drift1" cx="220" cy="70" rx="260" ry="160" fill="url(#blob1)"/>
    <ellipse class="drift2" cx="820" cy="210" rx="280" ry="170" fill="url(#blob2)"/>

    <!-- звёздочки -->
    <g fill="#e9d5ff">
      <circle class="twinkle" cx="90"  cy="40"  r="1.8"/>
      <circle class="twinkle" cx="930" cy="50"  r="2"   style="animation-delay:.8s"/>
      <circle class="twinkle" cx="160" cy="215" r="1.5" style="animation-delay:1.4s"/>
      <circle class="twinkle" cx="860" cy="120" r="1.6" style="animation-delay:.4s"/>
      <circle class="twinkle" cx="520" cy="30"  r="1.4" style="animation-delay:1.9s"/>
      <circle class="twinkle" cx="330" cy="235" r="1.7" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="700" cy="235" r="1.5" style="animation-delay:.2s"/>
    </g>

    <rect x="1" y="1" width="998" height="258" rx="22" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <g class="pulse">
    <text x="500" y="128" text-anchor="middle" class="title" fill="url(#textGrad)" filter="url(#glow)">Hello, I'm Alexander!</text>
  </g>
  <text x="500" y="182" text-anchor="middle" class="sub" fill="#d8b4fe" filter="url(#softGlow)">&lt; iOS Developer /&gt;</text>
</svg>
